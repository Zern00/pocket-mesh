name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Validate branch name
        run: tools/check_branch_name.sh "${{ github.head_ref }}"

  android:
    name: Android debug build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;30.0.16248370"

      - name: Build debug APK, test, and lint
        run: ./gradlew --no-daemon :android:app:assembleDebug :android:app:testDebugUnitTest :android:app:lintDebug

  cpp:
    name: C++ build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev --parallel 2

      - name: Check C++ formatting
        run: find renderer server android -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Test
        run: ctest --preset dev

  contracts:
    name: API contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install validators
        run: python -m pip install --requirement tools/requirements.txt

      - name: Validate OpenAPI and JSON Schema
        run: python tools/validate_contracts.py

      - name: Check whitespace
        run: git diff --check
